{% load pharmacy %}
<header class="site-header">
    <div class="header-contact">
        <div class="container header-contact-inner">
            <span>Pharmacy support, when you need it</span>
            <a href="tel:+{% pharmacy_phone_number %}">Call us: {% pharmacy_phone_display %}</a>
        </div>
    </div>

    <nav class="navbar" aria-label="Main navigation">
        <div class="container navbar-container">
            <a href="{% url 'home' %}" class="logo" aria-label="Vikadia Pharmacy and Home Care home">
                <img src="/media/logo chemist.png"
                     alt="Vikadia Pharmacy and Home Care">
            </a>

            <button class="nav-toggle"
                    type="button"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                    aria-controls="primary-navigation">
                <span class="nav-toggle-line"></span>
                <span class="nav-toggle-line"></span>
                <span class="nav-toggle-line"></span>
            </button>

            <div class="nav-links" id="primary-navigation">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'home' %}#services">Services</a>
                <a href="{% url 'products' %}">Products</a>
                <a href="{% url 'home' %}#home-care">Home Care</a>
                <a href="{% url 'home' %}#contact">Contact</a>
            </div>

            <div class="nav-actions">
                <a href="{% url 'products' %}#catalog-search"
                   class="nav-search"
                   aria-label="Search products">
                    {% category_icon "Search" "search-icon" %}
                    <span>Search</span>
                </a>
                <a href="{% pharmacy_whatsapp_url %}"
                   class="nav-whatsapp"
                   target="_blank"
                   rel="noopener noreferrer">
                    {% category_icon "Customer support" "whatsapp-mark-icon" %}
                    <span>WhatsApp the pharmacy</span>
                </a>
            </div>
        </div>
    </nav>
</header>
