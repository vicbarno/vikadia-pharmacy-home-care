services:
  - type: web
    name: vikadia-pharmacy-home-care
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vikadia-pharmacy-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

databases:
  - name: vikadia-pharmacy-db